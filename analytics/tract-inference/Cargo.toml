[package]
name = "gst-plugin-tract-inference"
version = { workspace = true }
description = "Model-agnostic Tract ONNX tensor inference for GStreamer video pipelines."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.28, gstreamer-base-1.0 >= 1.28, gstreamer-video-1.0 >= 1.28, gstreamer-analytics-1.0 >= 1.28, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
gst = { workspace = true, features = ["v1_28"] }
gst-analytics = { workspace = true, features = ["v1_28"] }
gst-base = { workspace = true, features = ["v1_28"] }
gst-inference-common = { path = "../inference-common" }
gst-video = { workspace = true, features = ["v1_28"] }
tract-onnx = { version = "=0.23.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tract-metal = { version = "=0.23.4", optional = true }

[features]
default = ["tract"]
static = []
capi = []
doc = ["gst/v1_28"]
tract = ["dep:tract-onnx"]
metal = ["tract", "dep:tract-metal"]

[lib]
name = "gsttractinference"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
gst-check = { workspace = true, features = ["v1_28"] }
tempfile = "3.27.0"

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
