[package]
name = "gst-plugin-ort-inference"
version = { workspace = true }
description = "Model-agnostic ONNX Runtime tensor inference for GStreamer video pipelines."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.28, gstreamer-base-1.0 >= 1.28, gstreamer-video-1.0 >= 1.28, gstreamer-analytics-1.0 >= 1.28, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
gst = { workspace = true, features = ["v1_28"] }
gst-analytics = { workspace = true, features = ["v1_28"] }
gst-base = { workspace = true, features = ["v1_28"] }
gst-inference-common = { path = "../inference-common" }
gst-video = { workspace = true, features = ["v1_28"] }
half = "2.6.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27", "half"] }

[features]
default = []
static = []
capi = []
doc = ["gst/v1_28"]
coreml = ["ort/coreml"]

[lib]
name = "gstortinference"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
gst-check = { workspace = true, features = ["v1_28"] }
gst-plugin-tract-inference = { path = "../tract-inference" }
tempfile = "3.27.0"

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
