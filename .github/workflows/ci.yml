name: CI

on:
  push:
    branches:
      - main
      - renovate/**
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Select checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.changes.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate check selection
        run: python3 -B ci/test_select_checks.py

      - name: Select checks
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/select_checks.py "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

  tract-metal:
    needs: changes
    if: fromJSON(needs.changes.outputs.checks).tract
    name: Test Tract Metal provider
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          brew install gstreamer pkgconf
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-analytics-1.0

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Test Metal provider
        run: cargo test -p gst-plugin-tract-inference --all-targets --features metal -- --nocapture

      - name: Lint Metal provider
        run: cargo clippy -p gst-plugin-tract-inference --all-targets --features metal -- -D warnings

      - name: Read minimum supported Rust version
        run: |
          sed -n 's/^rust-version = "\([^"]*\)"$/MSRV=\1/p' Cargo.toml >> "$GITHUB_ENV"

      - name: Cache minimum supported Rust version toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.MSRV }}-*
          key: rust-msrv-${{ runner.os }}-${{ runner.arch }}-${{ env.MSRV }}

      - name: Install minimum supported Rust version toolchain
        run: mise install "rust@$MSRV"

      - name: Test minimum supported Rust version
        run: cargo +"$MSRV" test --locked -p gst-plugin-tract-inference --all-targets --features metal

  ort-coreml:
    needs: changes
    if: fromJSON(needs.changes.outputs.checks).ort
    name: Test ONNX Runtime CoreML provider
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          brew install gstreamer pkgconf
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-analytics-1.0

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Test CoreML provider
        run: cargo test -p gst-plugin-ort-inference --all-targets --features coreml -- --nocapture

      - name: Lint CoreML provider
        run: cargo clippy -p gst-plugin-ort-inference --all-targets --features coreml -- -D warnings

      - name: Build CoreML provider
        run: cargo build -p gst-plugin-ort-inference --features coreml

      - name: Inspect ONNX Runtime inference plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 ortinference

      - name: Read minimum supported Rust version
        run: |
          sed -n 's/^rust-version = "\([^"]*\)"$/MSRV=\1/p' Cargo.toml >> "$GITHUB_ENV"

      - name: Cache minimum supported Rust version toolchain
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.MSRV }}-*
          key: rust-msrv-${{ runner.os }}-${{ runner.arch }}-${{ env.MSRV }}

      - name: Install minimum supported Rust version toolchain
        run: mise install "rust@$MSRV"

      - name: Test minimum supported Rust version
        run: cargo +"$MSRV" test --locked -p gst-plugin-ort-inference --all-targets --features coreml

  gstreamer-124:
    needs: changes
    if: fromJSON(needs.changes.outputs.checks).gstreamer124
    name: Check GStreamer 1.24 plugins
    runs-on: ${{ vars.RUNNER_UBUNTU_2404 || 'ubuntu-24.04' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer 1.24
        run: |
          sudo apt-get update
          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            install -y --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            libbz2-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
          pkg-config --atleast-version=1.24 gstreamer-1.0
          pkg-config --max-version=1.25.99 gstreamer-1.0
          pkg-config --modversion gstreamer-1.0

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check GStreamer 1.24 plugins
        run: |
          cargo check --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd

      - name: Test GStreamer 1.24 plugins
        run: |
          cargo test --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd

      - name: Lint GStreamer 1.24 plugins
        run: |
          cargo clippy --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd \
            -- -D warnings

  checks:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result == 'failure' ||
           (needs.changes.result == 'success' && fromJSON(needs.changes.outputs.checks).any)) }}
    name: Run Checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    services:
      nats:
        image: nats:2.15-alpine
        ports:
          - 4222:4222

    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: |
          echo "Check selection failed; refusing to skip validation."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare APT cache
        id: apt-cache-key
        run: |
          . /etc/os-release
          mkdir -p "$HOME/.cache/apt/archives/partial"
          echo "key=apt-v1-${ID}-${VERSION_ID}-$(dpkg --print-architecture)-${{ hashFiles('.github/workflows/ci.yml') }}-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "prefix=apt-v1-${ID}-${VERSION_ID}-$(dpkg --print-architecture)-${{ hashFiles('.github/workflows/ci.yml') }}-" >> "$GITHUB_OUTPUT"

      - name: Restore APT packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get \
            -o DPkg::Lock::Timeout=300 \
            -o Dir::Cache::archives="$HOME/.cache/apt/archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools \
            libbz2-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
          pkg-config --atleast-version=1.28 gstreamer-1.0
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-analytics-1.0
          gst-inspect-1.0 tensordecodebin

      - name: Save APT packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt/archives/*.deb
          key: ${{ steps.apt-cache-key.outputs.key }}

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check dependency policy
        # Advisories can change without a repository diff.
        run: mise run deps:check

      - name: Check dependency ordering
        if: fromJSON(needs.changes.outputs.checks).sort
        run: mise run sort:crates:check

      - name: Check formatting
        if: fromJSON(needs.changes.outputs.checks).format
        run: mise run fmt:check

      - name: Run clippy
        if: fromJSON(needs.changes.outputs.checks).rust
        run: mise run lint

      - name: Lint Tract without the backend
        if: fromJSON(needs.changes.outputs.checks).tract
        run: cargo clippy -p gst-plugin-tract-inference --all-targets --no-default-features -- -D warnings

      - name: Check build
        if: fromJSON(needs.changes.outputs.checks).rust
        run: mise run check

      - name: Run tests
        if: fromJSON(needs.changes.outputs.checks).rust
        run: mise run test

      - name: Run Core NATS integration tests
        if: fromJSON(needs.changes.outputs.checks).nats
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: mise run test:integration:nats

      - name: Run S2 Lite integration tests
        if: fromJSON(needs.changes.outputs.checks).s2
        run: mise run test:integration:s2

      - name: Build plugins
        if: fromJSON(needs.changes.outputs.checks).packaging
        run: mise run build

      - name: Validate cargo-c packages
        if: fromJSON(needs.changes.outputs.checks).packaging
        run: mise run package:check

      - name: Inspect console plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 console

      - name: Inspect Prometheus plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 prometheus

      - name: Inspect StatsD plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 statsd

      - name: Inspect lines plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 lines

      - name: Inspect NATS plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 nats

      - name: Inspect S2 plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 s2
          gst-inspect-1.0 s2src
          gst-inspect-1.0 s2sink

      - name: Inspect VLM plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 vlm
          gst-inspect-1.0 vlmanalysis

      - name: Inspect OCRs plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 ocrs
          gst-inspect-1.0 ocrsanalysis

      - name: Inspect Tract inference plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 tractinference

      - name: Inspect ONNX Runtime inference plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 ortinference

      - name: Inspect NanoDet decoder plugin
        if: fromJSON(needs.changes.outputs.checks).packaging
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 nanodet
          gst-inspect-1.0 nanodettensordec

      - name: Read minimum supported Rust version
        if: fromJSON(needs.changes.outputs.checks).rust
        run: |
          sed -n 's/^rust-version = "\([^"]*\)"$/MSRV=\1/p' Cargo.toml >> "$GITHUB_ENV"

      - name: Cache minimum supported Rust version toolchain
        if: fromJSON(needs.changes.outputs.checks).rust
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/${{ env.MSRV }}-*
          key: rust-msrv-${{ runner.os }}-${{ runner.arch }}-${{ env.MSRV }}

      - name: Install minimum supported Rust version toolchain
        if: fromJSON(needs.changes.outputs.checks).rust
        run: mise install "rust@$MSRV"

      - name: Test minimum supported Rust version
        if: fromJSON(needs.changes.outputs.checks).rust
        run: cargo +"$MSRV" test --workspace --all-targets --locked
