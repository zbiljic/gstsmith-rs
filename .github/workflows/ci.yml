name: CI

on:
  push:
    branches:
      - main
      - renovate/**
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tract-metal:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Test Tract Metal provider
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          brew install gstreamer pkgconf
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-analytics-1.0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test Metal provider
        run: cargo test -p gst-plugin-tract-inference --all-targets --features metal -- --nocapture

      - name: Lint Metal provider
        run: cargo clippy -p gst-plugin-tract-inference --all-targets --features metal -- -D warnings

  ort-coreml:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Test ONNX Runtime CoreML provider
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          brew install gstreamer pkgconf
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-analytics-1.0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test CoreML provider
        run: cargo test -p gst-plugin-ort-inference --all-targets --features coreml -- --nocapture

      - name: Lint CoreML provider
        run: cargo clippy -p gst-plugin-ort-inference --all-targets --features coreml -- -D warnings

      - name: Build CoreML provider
        run: cargo build -p gst-plugin-ort-inference --features coreml

      - name: Inspect ONNX Runtime inference plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 ortinference

  gstreamer-124:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Check GStreamer 1.24 plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer 1.24
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            libbz2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
          pkg-config --atleast-version=1.24 gstreamer-1.0
          pkg-config --max-version=1.25.99 gstreamer-1.0
          pkg-config --modversion gstreamer-1.0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check GStreamer 1.24 plugins
        run: |
          cargo check --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd

      - name: Test GStreamer 1.24 plugins
        run: |
          cargo test --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd

      - name: Lint GStreamer 1.24 plugins
        run: |
          cargo clippy --all-targets \
            -p gst-plugin-console \
            -p gst-plugin-lines \
            -p gst-plugin-nats \
            -p gst-plugin-s2 \
            -p gst-plugin-vlm \
            -p gst-plugin-ocrs \
            -p gst-plugin-prometheus \
            -p gst-plugin-statsd \
            -- -D warnings

  checks:
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          !startsWith(github.head_ref, 'renovate/') }}
    name: Run Checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    services:
      nats:
        image: nats:2.14-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools \
            libbz2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
          pkg-config --atleast-version=1.28 gstreamer-1.0
          pkg-config --atleast-version=1.28 gstreamer-analytics-1.0
          pkg-config --modversion gstreamer-1.0
          pkg-config --modversion gstreamer-analytics-1.0
          gst-inspect-1.0 tensordecodebin

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check dependency policy
        run: mise run deps:check

      - name: Check dependency ordering
        run: mise run sort:crates:check

      - name: Check formatting
        run: mise run fmt:check

      - name: Run clippy
        run: mise run lint

      - name: Check build
        run: mise run check

      - name: Run tests
        run: mise run test

      - name: Run Core NATS integration tests
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: mise run test:integration:nats

      - name: Run S2 Lite integration tests
        run: mise run test:integration:s2

      - name: Build plugins
        run: mise run build

      - name: Validate cargo-c packages
        run: mise run package:check

      - name: Inspect console plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 console

      - name: Inspect Prometheus plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 prometheus

      - name: Inspect StatsD plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 statsd

      - name: Inspect lines plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 lines

      - name: Inspect NATS plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 nats

      - name: Inspect S2 plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 s2
          gst-inspect-1.0 s2src
          gst-inspect-1.0 s2sink

      - name: Inspect VLM plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 vlm
          gst-inspect-1.0 vlmanalysis

      - name: Inspect OCRs plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 ocrs
          gst-inspect-1.0 ocrsanalysis

      - name: Inspect Tract inference plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 tractinference

      - name: Inspect ONNX Runtime inference plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 ortinference

      - name: Inspect NanoDet decoder plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 nanodet
          gst-inspect-1.0 nanodettensordec
