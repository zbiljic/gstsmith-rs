name: CI

on:
  push:
    branches:
      - main
      - renovate/**
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Run Checks
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      nats:
        image: nats:2.12-alpine
        ports:
          - 4222:4222

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check dependency policy
        run: mise run deps:check

      - name: Check formatting
        run: mise run fmt:check

      - name: Run clippy
        run: mise run lint

      - name: Check build
        run: mise run check

      - name: Run tests
        run: mise run test

      - name: Run Core NATS integration tests
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
        run: cargo test -p gst-plugin-nats --test nats_integration -- --ignored --test-threads=1

      - name: Pull S2 Lite image
        run: |
          for attempt in 1 2 3; do
            docker pull ghcr.io/s2-streamstore/s2:0.41.1 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 2
          done

      - name: Run S2 Lite integration tests
        run: cargo test -p gst-plugin-s2 --test s2_lite -- --ignored --test-threads=1

      - name: Build plugins
        run: mise run build

      - name: Inspect console plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 console

      - name: Inspect lines plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 lines

      - name: Inspect NATS plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: gst-inspect-1.0 nats

      - name: Inspect S2 plugin
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 s2
          gst-inspect-1.0 s2src
          gst-inspect-1.0 s2sink
