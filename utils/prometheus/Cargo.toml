[package]
name = "gst-plugin-prometheus"
version = { workspace = true }
description = "Bounded Prometheus metrics tracer and OpenMetrics HTTP endpoint for GStreamer."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
bytes = "1"
gst = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
papaya = "0.2.4"
parking_lot = "0.12"
prometheus-client = "0.25.0"
regex = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[features]
static = []
capi = []
doc = ["gst/v1_24"]

[lib]
name = "gstprometheus"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
